project_id = "project2ak"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# Downscaled receipts are ~200–400 KB; 10 MB leaves room for an un-downscaled
# camera capture on a slow client without letting a video through.
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# One user. Signups stay open only long enough to create that user; close it
# after and the magic-link flow keeps working for the existing account.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[inbucket]
enabled = true
port = 54324
